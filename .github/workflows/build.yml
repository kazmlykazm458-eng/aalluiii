- name: Install system deps
  run: |
    sudo apt update
    # تثبيت الحزم الأساسية (تم إزالة libtinfo5 من السطر التالي)
    sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
      pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
      cmake libffi-dev libssl-dev
      
    # تحميل وتثبيت libtinfo5 يدوياً لأنها غير موجودة في Ubuntu 24.04
    wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
    sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
    rm -f libtinfo5_6.3-2ubuntu0.1_amd64.deb
