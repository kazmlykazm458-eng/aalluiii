name: Build Iraq APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libtinfo5

      - name: Install Python deps
        run: |
          pip install --user --upgrade buildozer cython virtualenv pillow
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Arabic font
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/NotoNaskhArabic-Regular.ttf "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"

      - name: Generate icon
        run: python make_icon.py

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraq-apk
          path: bin/*.apk
