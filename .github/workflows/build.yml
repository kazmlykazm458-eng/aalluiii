name: Build Iraq APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libtinfo5

      - name: Install Python deps
        run: |
          pip install --user --upgrade buildozer "cython<3" virtualenv pillow
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pin stable build settings
        run: |
          python - <<'EOF'
          import re
          p = 'buildozer.spec'
          s = open(p, encoding='utf-8').read()
          vals = {
              'p4a.branch': 'v2024.01.21',
              'android.ndk': '25b',
              'android.api': '33',
              'android.archs': 'arm64-v8a',
          }
          for k in vals:
              s = re.sub(r'^[ \t]*#?[ \t]*' + re.escape(k) + r'[ \t]*=.*\n', '', s, flags=re.M)
          block = ''.join(f'{k} = {v}\n' for k, v in vals.items())
          s = s.replace('[app]\n', '[app]\n' + block, 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -nE "^(p4a.branch|android.ndk|android.api|android.archs|requirements)" buildozer.spec

      - name: Download Arabic font
        run: |
          mkdir -p assets/fonts
          curl -L -o assets/fonts/NotoNaskhArabic-Regular.ttf "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf"

      - name: Generate icon
        run: python make_icon.py

      - name: Build APK
        run: |
          yes | buildozer android debug > build.log 2>&1

      - name: Extract error
        if: failure()
        run: |
          grep -n -i -E "error|failed|exception|not found" build.log | tail -40 > errors.txt
          tail -80 build.log >> errors.txt

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: errors.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iraq-apk
          path: bin/*.apk
